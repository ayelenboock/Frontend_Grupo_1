<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Asistencias - Instituto San Agustín</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="../index.html">
            <img src="../img/logo_gorro.png" alt="Logo Instituto San Agustín" class="logo-img">
            </a>
            <div class="institution-title">
                <h1>Instituto San Agustín</h1>
            </div>
        </div>
        <nav>
            <ul>                
                <li><a href="../index.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="dashboard-container">
        <aside>
            <h3>MENÚ +</h3>
            <ul>
                <li><a href="panel_profesor.html">Inicio</a></li>
                <li><a href="carga_notas.html">Carga de notas</a></li>
                <li><a href="carga_asistencias.html" class="active">Carga de asistencias</a></li>
                <li><a href="listado_estudiantes.html">Listado de estudiantes</a></li>                
            </ul>
        </aside>

        <main>
            <div class="card">
                <h2>CARGA DE ASISTENCIAS</h2>
                <div class="form-group">
                    <label for="materia">Seleccionar materia:</label>
                    <select id="materia" class="input-rounded"></select>
                </div> 
                <div class="form-group">
                    <label for="fecha">Fecha a cargar:</label>
                    <input type="date" id="fecha" class="input-rounded">
                </div>             

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Estudiante</th>
                                <th>ASISTENCIA</th>
                            </tr>
                        </thead>    
                        <tbody id="tabla_asistencia"></tbody>
                        
                    </table>
                </div>
                <p id="mensaje-asistencia" class="mensaje-error"></p>
                <button type="button" id="btn-guardar-asistencia" class="btn">Guardar asistencia</button>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Instituto San Agustín. Todos los derechos reservados.</p>
        <p class="creditos">
            Logo: imagen de <a href="https://www.freepik.com" target="_blank"
        rel="noopener"> Magnific (ex Freepik)</a>
        </p>
    </footer>
    <script
        src="../js/carga_asistencias.js">
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto San Agustín - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="card">
            <img src="../img/logo_gorro.png" alt="Logo Instituto San Agustín" class="logo-img" >
            <h2 >INSTITUTO SAN AGUSTÍN</h2>
            
            
            <form id="form-login" action="panel_profesor.html" 
            method="GET">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" class="input-rounded" placeholder="USUARIO">
                </div>
                
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" class="input-rounded" placeholder="CONTRASEÑA">
                </div>

                <p id="mensaje-error" class="mensaje-error"></p>
                
                <button type="submit" class="btn btn-block" >INGRESAR</button>
            </form>

            <p >
                <a href="#" >¿Olvidaste la contraseña/usuario?</a> <!-- Falta página -->
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Instituto San Agustín. Todos los derechos reservados.</p>
    </footer>

    <script src="../js/main.js"></script> <!-- conexión a main.js-->

</body>
</html>
